name: twilio_voice
description: Provides an interface to Twilio's Programmable Voice SDK to allow adding voice-over-IP (VoIP) calling into your Flutter applications.
version: 0.5.0
homepage: https://twilio-voice-web.web.app/
repository: https://github.com/cybex-dev/twilio_voice
issue_tracker: https://github.com/cybex-dev/twilio_voice/issues
topics:
  - twilio
  - voice
  - voip
  - call
  - phone

environment:
  # Dart 3.3+ required for extension types (dart:js_interop) used by the web implementation.
  sdk: ">=3.3.0 <4.0.0"
  # Flutter 3.22+ ships Dart 3.4 and is the minimum required by web_callkit 1.0.0.
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.4
  web: ^1.1.0
  web_callkit: ^1.0.1

dev_dependencies:
  flutter_lints: ^2.0.2
  flutter_test:
    sdk: flutter
#  matcher: ^0.12.17

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.twilio.twilio_voice
        pluginClass: TwilioVoicePlugin
      ios:
        pluginClass: TwilioVoicePlugin
      web:
        # As a temporary measure, the web implementation of a plugin is defined in
        # `twilio_voice_web`, but this will change soon with the migration to a federated
        # plugin structure.
        pluginClass: TwilioVoiceWeb
        fileName: _internal/twilio_voice_web.dart
      macos:
        pluginClass: TwilioVoicePlugin

  # The Twilio Voice JS SDK is bundled with the plugin and loaded automatically by the web
  # implementation (see TwilioVoiceWeb.ensureSdkLoaded). Apps no longer need to add a <script>
  # tag to their web/index.html. Served at:
  #   assets/packages/twilio_voice/assets/twilio.min.js
  assets:
    - assets/twilio.min.js

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
